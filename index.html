<style>
/* Layout: one mobile column (max 520px), sticky header, fixed bottom tab bar like a native Telegram Mini App */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#14181F; --muted:#5B6573; --line:#D6DCE3;
  --accent:#1F4FD8; --on-accent:#FFFFFF; --soft:#E3E9F8;
  --red:#D7322E; --yellow:#D99A00; --green:#2E9B57;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171B22; --ink:#E8ECF1; --muted:#95A0AE; --line:#2A313B;
  --accent:#7290FF; --on-accent:#0B0E14; --soft:#1E2740;
  --red:#F0605A; --yellow:#F2C14E; --green:#4CC37C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --ink:#E8ECF1; --muted:#95A0AE; --line:#2A313B;
  --accent:#7290FF; --on-accent:#0B0E14; --soft:#1E2740;
  --red:#F0605A; --yellow:#F2C14E; --green:#4CC37C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:8px calc(88px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.date{color:var(--muted);font-size:13px}
h2{font-family:var(--display);font-weight:500;font-size:20px;margin:18px 0 10px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hero{background:var(--accent);color:var(--on-accent);border:0;position:relative;overflow:hidden}
.hero .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hero .t{font-family:var(--display);font-size:24px;font-weight:700;margin:4px 0 2px;text-wrap:balance}
.hero .s{opacity:.9;font-size:14px}
.plates{position:absolute;right:-18px;top:-18px;display:flex;gap:4px;opacity:.22}
.plates i{display:block;width:16px;border-radius:4px;background:var(--on-accent)}
.ex{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.ex:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ex.done{opacity:.55}

.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:transparent;cursor:pointer;color:var(--on-accent)}

.seg button.on{background:var(--accent);color:var(--on-accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:flex;flex-direction:column;gap:6px}
.wd{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}

.field{display:flex;flex-direction:column;gap:4px;flex:1 1 130px;min-width:0}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.meal{display:flex;flex-direction:column;gap:6px}

.meal ul{margin:0;padding-left:18px;color:var(--ink)}
.meal li{margin:2px 0}
.filters-btn{align-self:flex-start;border:0;background:var(--soft);color:var(--accent);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;margin-top:2px}
.btn{border:0;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;padding:14px;border-radius:12px;cursor:pointer;width:100%}
.btn.ghost{background:var(--soft);color:var(--accent)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;width:100%}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,10,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .p{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet canvas{width:100%;aspect-ratio:6/5;max-width:100%;background:var(--surface);border-radius:var(--r);border:1px solid var(--line);display:block}
.sheet ol{padding-left:20px;margin:6px 0}
.sheet ol li{margin:4px 0}
.x{border:0;background:var(--surface);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.timer{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;text-align:center}
.note{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:600}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

  <header class="top"><div class="brand">Железный <b>день</b></div><div class="date num" id="today"></div></header>

<script>
(function(){
const tg = window.Telegram && window.Telegram.WebApp;
if (tg){ try{ tg.ready(); tg.expand(); if(tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme; }catch(e){} }
const haptic = t => { try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} };

/* ---------- state ---------- */
const KEY='ironday.v1';
const DEF={tab:'today',profile:{sex:'m',age:27,height:178,weight:76,goal:'mass',level:'beginner'},
  place:'gym',equip:{dumbbell:false,bar:true,chair:true},type:'full',days:[0,2,4],time:'19:00',budget:3500,checks:{},history:[]};
let S;
try{ S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){ S=JSON.parse(JSON.stringify(DEF)); }
S.profile=Object.assign({},DEF.profile,S.profile); S.equip=Object.assign({},DEF.equip,S.equip);
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };

/* ---------- stick-figure animation (two-bone IK between two key poses) ---------- */
const L={torso:50,thigh:44,shin:42,uarm:30,farm:28};
const FLOOR=185;
function ik(a,t,l1,l2,s){
  const dx=t[0]-a[0],dy=t[1]-a[1],d=Math.hypot(dx,dy);
  const dc=Math.min(l1+l2-.5,Math.max(Math.abs(l1-l2)+.5,d));
  const phi=Math.atan2(dy,dx);
  let c=(l1*l1+dc*dc-l2*l2)/(2*l1*dc); c=Math.max(-1,Math.min(1,c));
  const al=Math.acos(c);
  return [[a[0]+l1*Math.cos(phi+s*al),a[1]+l1*Math.sin(phi+s*al)],[a[0]+dc*Math.cos(phi),a[1]+dc*Math.sin(phi)]];
}
const lerp=(a,b,t)=>a+(b-a)*t;
const lp=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
function blend(A,B,t){
  const o={};
  for(const k of ['hip','sh','ank','ank2','wr','wrR','wr2'])
    if(A[k]) o[k]=lp(A[k],B[k]||A[k],t);
  if(A.lean!=null) o.lean=lerp(A.lean,B.lean,t);
  o.ls=A.ls||-1; o.es=A.es||1;
  return o;
}
function solve(p){
  const hip=p.hip; let dir;
  if(p.sh){ const dx=p.sh[0]-hip[0],dy=p.sh[1]-hip[1],d=Math.hypot(dx,dy)||1; dir=[dx/d,dy/d]; }
  else { const r=p.lean*Math.PI/180; dir=[Math.sin(r),-Math.cos(r)]; }
  const sh=[hip[0]+dir[0]*L.torso,hip[1]+dir[1]*L.torso];
  const head=[sh[0]+dir[0]*15,sh[1]+dir[1]*15];
  const wr=p.wr||[sh[0]+p.wrR[0],sh[1]+p.wrR[1]];
  const [knee,ank]=ik(hip,p.ank,L.thigh,L.shin,p.ls);
  const [knee2,ank2]=ik(hip,p.ank2||p.ank,L.thigh,L.shin,p.ls);
  const [elb,hand]=ik(sh,wr,L.uarm,L.farm,p.es);
  const [elb2,hand2]=ik(sh,p.wr2||wr,L.uarm,L.farm,p.es);
  return {hip,sh,head,knee,ank,knee2,ank2,elb,hand,elb2,hand2};
}
function toe(a){
  if(a[1]>168){ const dy=Math.min(11,FLOOR-1-a[1]); return [a[0]+Math.sqrt(Math.max(16,144-dy*dy)),FLOOR-1]; }
  return [a[0]+5,a[1]+10];
}
let COL={};
function readCols(){ const cs=getComputedStyle(document.documentElement); COL={ink:cs.getPropertyValue('--ink').trim(),muted:cs.getPropertyValue('--muted').trim(),line:cs.getPropertyValue('--line').trim(),accent:cs.getPropertyValue('--accent').trim(),bg:cs.getPropertyValue('--surface').trim()}; }
function drawFig(ctx,ex,t,W,H){
  const sc=Math.min(W/240,H/212); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  ctx.setTransform(sc,0,0,sc,(W-240*sc)/2,(H-212*sc)/2+16*sc);
  const P=solve(blend(ex.A,ex.B,t)), pr=ex.props||{};
  ctx.lineCap='round'; ctx.lineJoin='round';
  // props behind
  ctx.fillStyle=COL.line; ctx.strokeStyle=COL.line;
  if(!pr.noFloor){ ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(4,FLOOR+1); ctx.lineTo(236,FLOOR+1); ctx.stroke(); }
  if(pr.bench){ const [x1,x2,y]=pr.bench; ctx.fillRect(x1,y,x2-x1,7); ctx.fillRect(x1+6,y,5,FLOOR-y); ctx.fillRect(x2-11,y,5,FLOOR-y); }
  if(pr.pullbar){ ctx.lineWidth=5; ctx.strokeStyle=COL.muted; ctx.beginPath(); ctx.moveTo(60,pr.pullbar); ctx.lineTo(190,pr.pullbar); ctx.stroke(); }
  const seg=(pts,c,w)=>{ ctx.strokeStyle=c; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(const q of pts.slice(1)) ctx.lineTo(q[0],q[1]); ctx.stroke(); };
  // far limbs
  seg([P.hip,P.knee2,P.ank2,toe(P.ank2)],COL.muted,8);
  seg([P.sh,P.elb2,P.hand2],COL.muted,7);
  // torso + near leg
  seg([P.hip,P.sh],COL.ink,11);
  seg([P.hip,P.knee,P.ank,toe(P.ank)],COL.ink,9);
  ctx.fillStyle=COL.ink; ctx.beginPath(); ctx.arc(P.head[0],P.head[1],10,0,7); ctx.fill();
  seg([P.sh,P.elb,P.hand],COL.ink,8);
  // load
  const plate=(p,r)=>{ ctx.fillStyle=COL.accent; ctx.beginPath(); ctx.arc(p[0],p[1],r,0,7); ctx.fill(); ctx.fillStyle=COL.bg; ctx.beginPath(); ctx.arc(p[0],p[1],r*.28,0,7); ctx.fill(); };
  if(pr.plate) plate(P.hand,15);
  if(pr.db){ plate(P.hand,8); }
}
const canvases=new Set();
function regCanvas(cv,ex,big){ cv._ex=ex; cv._big=big; canvases.add(cv); }
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(ts){
  for(const cv of canvases){
    if(!cv.isConnected){ canvases.delete(cv); continue; }
    const r=cv.getBoundingClientRect(); if(!r.width) continue;
    const dpr=window.devicePixelRatio||1, W=Math.round(r.width*dpr), H=Math.round(r.height*dpr);
    if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
    const ex=cv._ex, per=ex.hold?3600:2600;
    let ph=(ts%per)/per, t=reduce?(cv._big?.5:1):(1-Math.cos(ph*2*Math.PI))/2;
    if(ex.hold) t=reduce?0:t;
    drawFig(cv.getContext('2d'),ex,t,W,H);
  }
  requestAnimationFrame(loop);
}

 {id:'bench',name:'Жим штанги лёжа',group:'push',kind:'comp',equip:'barbell',place:['gym'],muscles:'Грудь, трицепсы, передние дельты',props:{plate:1,bench:[62,168,150]},

 {id:'deadlift',name:'Становая тяга',group:'hinge',kind:'comp',equip:'barbell',place:['gym'],muscles:'Спина, ягодицы, бицепс бедра',props:{plate:1},
  A:{hip:[88,135],lean:58,ank:[112,183],wr:[122,166]},B:{hip:[108,98],lean:0,ank:[112,183],wr:[112,104]},
  cues:['Гриф над серединой стопы, стопы на ширине таза.','Наклонись с прямой спиной и возьми гриф хватом чуть шире ног.','Опусти таз, грудь вперёд, плечи над грифом.','Тяни штангу вдоль ног, разгибая колени и таз одновременно.','Наверху выпрямись полностью, не отклоняясь назад.']},

}

  const P=N.prot, Fa=N.fat, C=N.carb*k;
  const meals=[
    {slot:'b',n:'Завтрак',w:.25},
    {slot:'l',n:'Обед',w:.32},
    {slot:'s',n:train?'Перед тренировкой':'Перекус',w:.15},
    {slot:'d',n:train?'Ужин после тренировки':'Ужин',w:.28}
  ].map(m=>Object.assign(m,dishFor(day,m.slot,ecoMask[m.slot]),{eco:!!ecoMask[m.slot]}));
  const r5=v=>Math.max(5,Math.round(v/5)*5);
  let tot=[0,0,0];
  const out=meals.map(m=>{
    const pf=F[m.p], cf=F[m.c];
    const xc=m.x.reduce((a,[f,g])=>a+F[f][3]*g/100,0), xp=m.x.reduce((a,[f,g])=>a+F[f][1]*g/100,0);
    const cg=r5(Math.max(cf[3]>30?20:100,(C*m.w-xc)/cf[3]*100)); const pAfterC=cf[1]*cg/100*.5;
    const pg=r5(Math.max(m.p==='cheese'?40:60,(P*m.w-pAfterC-xp)/pf[1]*100));
    return {n:m.n,slot:m.slot,t:m.t,eco:m.eco,items:[[m.p,pg],[m.c,cg],...m.x.map(a=>a.slice())]};
  });
  out.forEach(m=>m.items.forEach(([f,g])=>{ const d=F[f]; tot[0]+=d[1]*g/100; tot[1]+=d[2]*g/100; tot[2]+=d[3]*g/100; }));
  const fatLeft=Fa-tot[1];
  if(fatLeft>8){ const ng=r5(Math.min(40,fatLeft*.5/F[NUT][2]*100)); out[2].items.push([NUT,ng]); const og=r5(Math.max(0,fatLeft-F[NUT][2]*ng/100)); if(og>=5){ out[1].items.push([OIL,Math.round(og/2)]); out[3].items.push([OIL,Math.round(og/2)]); } }
  const isFat=f=>f===OIL||f===NUT;
  const target=train?N.trainK:N.restK, kc=it=>it.reduce((a,[f,g])=>a+(F[f][1]*4+F[f][2]*9+F[f][3]*4)*g/100,0);
  const all=out.reduce((a,m)=>a+kc(m.items),0), fixed=out.reduce((a,m)=>a+kc(m.items.slice(2).filter(([f])=>!isFat(f))),0);
  const ratio=Math.max(.6,Math.min(1.4,(target-fixed)/(all-fixed)));
  out.forEach(m=>m.items.forEach((it,i)=>{ if(i<2||isFat(it[0])) it[1]=it[0]===OIL?Math.max(5,Math.round(it[1]*ratio)):r5(it[1]*ratio); }));
  tot=[0,0,0];
  out.forEach(m=>{ m.k=0; m.items.forEach(([f,g])=>{ const d=F[f]; const p=d[1]*g/100,fa=d[2]*g/100,c=d[3]*g/100; tot[0]+=p; tot[1]+=fa; tot[2]+=c; m.k+=p*4+fa*9+c*4; }); m.k=Math.round(m.k); m.cost=cost(m.items); });
  return {meals:out,tot:tot.map(Math.round),kcal:Math.round(tot[0]*4+tot[1]*9+tot[2]*4),cost:out.reduce((a,m)=>a+m.cost,0)};
}
// whole week: start from the regular menu, then swap the priciest meals for budget ones until the week fits
function weekPlan(){
  const masks=[0,1,2,3,4,5,6].map(()=>({}));
  const days=masks.map((m,d)=>menu(d,m));
  const total=()=>days.reduce((a,x)=>a+x.cost,0);
  let replaced=0;
  if(S.budget>0){
    for(let guard=0;guard<28&&total()>S.budget*.93;guard++){
      let best=null;
      days.forEach((x,d)=>x.meals.forEach(m=>{ if(!m.eco&&(!best||m.cost>best.c)) best={d,slot:m.slot,c:m.cost}; }));
      if(!best) break;
      masks[best.d][best.slot]=1; days[best.d]=menu(best.d,masks[best.d]); replaced++;
    }
  }
  return {days,total:total(),replaced};
}
function shopping(plan){
  const agg={};
  plan.days.forEach(x=>x.meals.forEach(m=>m.items.forEach(([f,g])=>{ agg[f]=(agg[f]||0)+g; })));
  return Object.entries(agg).map(([f,g])=>{
    const liquid=['kefir','milk','oil','oilS'].includes(f);
    const q=f==='eggs'?Math.ceil(g/55)+' шт.':g>=1000?(g/1000).toFixed(1).replace('.',',')+(liquid?' л':' кг'):Math.round(g/10)*10+(liquid?' мл':' г');
    return {f,n:F[f][0],q,c:(PRICE[f]||0)*g/1000};
  }).sort((a,b)=>b.c-a.c);
}

  const ck=t.closest('[data-chk]'); if(ck){ const k=ck.dataset.chk; S.checks[k]=!S.checks[k]; save(); haptic('medium'); render(); return; }
  const sg=t.closest('[data-set] button'); if(sg){ S[sg.parentNode.dataset.set]=sg.dataset.v; save(); haptic(); render(); return; }
  const eq=t.closest('[data-eq] button'); if(eq){ S.equip[eq.dataset.k]=!S.equip[eq.dataset.k]; save(); render(); return; }
  const d=t.closest('#days button'); if(d){ const i=+d.dataset.d; S.days=S.days.includes(i)?S.days.filter(x=>x!==i):[...S.days,i]; save(); haptic(); render(); return; }
  const lf=t.closest('#lf button'); if(lf){ libFilter=lf.dataset.g; render(); return; }
  const fd=t.closest('#fdays button'); if(fd){ foodDay=+fd.dataset.d; haptic(); render(); return; }
  const sw=t.closest('[data-swap]'); if(sw){ S.swap=S.swap||{}; const k=foodDay+':'+sw.dataset.swap; S.swap[k]=((S.swap[k]||0)+1)%7; save(); haptic(); render(); return; }
  if(t.id==='finish'){ const ds=isoDate(new Date()); if(!S.history.includes(ds)) S.history.push(ds); save(); try{tg&&tg.HapticFeedback.notificationOccurred('success')}catch(_){}; render(); return; }
  if(t.id==='reset'){ $('#resetConfirm').innerHTML='<div class="row" style="margin-top:8px"><button class="btn" id="resetYes" style="flex:1;background:var(--red)">Да, сбросить</button><button class="btn ghost" id="resetNo" style="flex:1">Отмена</button></div>'; return; }
  if(t.id==='resetYes'){ S.checks={}; S.history=[]; save(); render(); return; }
  if(t.id==='resetNo'){ $('#resetConfirm').innerHTML=''; return; }
  if(t.id==='sheet'||t.closest('#closeSheet')) closeSheet();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.p){ const v=t.tagName==='SELECT'?t.value:parseFloat(t.value); if(t.tagName==='SELECT'||!isNaN(v)){ S.profile[t.dataset.p]=v; save(); render(); } }
  if(t.id==='time'){ S.time=t.value; save(); }
  if(t.id==='budget'){ S.budget=Math.max(0,Math.round(+t.value||0)); save(); haptic(); render(); }
});

/* ---------- exercise sheet ---------- */
let timerInt=null;
function openEx(id){
  const e=EXM[id], d=dose(e);
  $('#sheetBody').innerHTML=`<div class="row" style="justify-content:space-between;align-items:center;flex-wrap:nowrap"><h2 style="margin:0">${esc(e.name)}</h2><button class="x" id="closeSheet" aria-label="Закрыть">×</button></div>
  <div class="row" style="margin:8px 0 12px"><span class="pill">${esc(e.muscles)}</span><span class="pill">${{barbell:'Штанга',dumbbell:'Гантели',bar:'Турник',none:'Свой вес',chair:'Стул / скамья'}[e.equip]}</span></div>
  <canvas id="bigcv"></canvas>
  <div class="stats" style="margin-top:10px"><div class="stat"><div class="v">${d.s}</div><div class="l">подходов</div></div><div class="stat"><div class="v">${d.r}</div><div class="l">${e.kind==='hold'?'время':'повторений'}</div></div><div class="stat"><div class="v">${d.rest} с</div><div class="l">отдых</div></div></div>
  <h3>Техника</h3><ol>${e.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>
  <h3>Таймер отдыха</h3><div class="card stack"><div class="timer" id="tm">${fmt(d.rest)}</div><button class="btn" id="tmGo" data-s="${d.rest}">Старт</button></div>`;
  $('#sheet').hidden=false; document.body.style.overflow='hidden';
  regCanvas($('#bigcv'),e,true);
  $('#tmGo').onclick=ev=>{
    clearInterval(timerInt); let s=+ev.target.dataset.s; ev.target.textContent='Заново'; $('#tm').textContent=fmt(s);
    timerInt=setInterval(()=>{ s--; const el=$('#tm'); if(!el){clearInterval(timerInt);return;} el.textContent=fmt(Math.max(0,s)); if(s<=0){ clearInterval(timerInt); el.textContent='Подход!'; try{tg&&tg.HapticFeedback.notificationOccurred('warning')}catch(_){}} },1000);
  };
  if(tg&&tg.BackButton){ try{ tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }catch(_){} }
}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function closeSheet(){ clearInterval(timerInt); $('#sheet').hidden=true; $('#sheetBody').innerHTML=''; document.body.style.overflow=''; if(tg&&tg.BackButton){ try{ tg.BackButton.hide(); tg.BackButton.offClick(closeSheet);}catch(_){} } }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCols);
if(tg) try{ tg.onEvent('themeChanged',()=>{ document.documentElement.dataset.theme=tg.colorScheme; readCols(); }); }catch(_){}

render(); requestAnimationFrame(loop);
})();
</script>
